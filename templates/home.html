{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏠 Smart House Price Predictor</title>

  <!-- Tailwind & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .animate-fadein {
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    iframe {
      border: 0;
      border-radius: 1rem;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center text-white p-6">

  <h1 class="text-5xl font-extrabold mb-6 text-center drop-shadow-lg">
    🏡 Smart House Price Predictor
  </h1>

  <p class="text-gray-300 mb-8 text-center max-w-2xl">
    Enter your house details below to get an instant AI-powered price prediction in Indian Rupees.
  </p>

  <form id="predictForm"
    class="glass-card p-8 rounded-2xl max-w-lg w-full space-y-5 animate-fadein transition">

    <div>
      <label class="block mb-1 font-semibold">🏠 Square Feet:</label>
      <input type="number" name="sqft" class="w-full p-3 rounded-lg bg-gray-800 text-white border border-gray-700" required>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block mb-1 font-semibold">🛏 Bedrooms:</label>
        <input type="number" name="bedrooms" class="w-full p-3 rounded-lg bg-gray-800 text-white border border-gray-700" required>
      </div>
      <div>
        <label class="block mb-1 font-semibold">🛁 Bathrooms:</label>
        <input type="number" name="bathrooms" class="w-full p-3 rounded-lg bg-gray-800 text-white border border-gray-700" required>
      </div>
    </div>

    <div>
      <label class="block mb-1 font-semibold">📍 ZIP Code:</label>
      <input type="text" name="zipcode" class="w-full p-3 rounded-lg bg-gray-800 text-white border border-gray-700" required>
    </div>

    <div>
      <label class="block mb-1 font-semibold">🏗 Year Built:</label>
      <input type="number" name="year_built" class="w-full p-3 rounded-lg bg-gray-800 text-white border border-gray-700" required>
    </div>

    <button type="submit"
      class="w-full py-3 rounded-xl font-semibold bg-blue-600 hover:bg-blue-700 transition text-lg shadow-lg hover:shadow-blue-500/30">
      🔍 Predict Price
    </button>
  </form>

  <!-- Prediction Result -->
  <div id="result"
    class="mt-8 text-3xl font-bold text-center transition animate-fadein"></div>

  <!-- Map -->
  <div id="mapContainer" class="mt-10 w-full max-w-2xl hidden">
    <h3 class="text-xl font-semibold mb-3 text-center">📍 Location Preview</h3>
    <iframe id="mapFrame"
      class="w-full h-64 glass-card"
      allowfullscreen
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <!-- Chart -->
  <div class="mt-10 w-full max-w-2xl glass-card p-4 rounded-2xl">
    <canvas id="priceChart"></canvas>
  </div>

  <footer class="mt-10 text-gray-400 text-sm text-center">
    Made with ❤️ By Komall Baraskar
  </footer>

  <script>
    const form = document.getElementById('predictForm');
    const resultDiv = document.getElementById('result');
    const priceChartCtx = document.getElementById('priceChart');
    const mapContainer = document.getElementById('mapContainer');
    const mapFrame = document.getElementById('mapFrame');

    let chart = new Chart(priceChartCtx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Predicted Price (₹)',
          data: [],
          borderColor: 'rgb(59, 130, 246)',
          backgroundColor: 'rgba(59, 130, 246, 0.2)',
          borderWidth: 3,
          tension: 0.4,
          fill: true,
          pointBackgroundColor: 'white'
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
            ticks: { color: 'white' }
          },
          x: { ticks: { color: 'white' } }
        },
        plugins: {
          legend: { labels: { color: 'white' } }
        }
      }
    });

    // 🎉 Confetti function
    function fireConfetti() {
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#3b82f6', '#22c55e', '#facc15']
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultDiv.innerHTML = "⏳ Predicting price...";
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/api/predict/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        console.log("🔍 API Response:", result);

        if (response.ok && result.predicted_price_inr) {
          const priceText = result.predicted_price_inr;
          const priceValue = parseFloat(result.predicted_price_raw);

          resultDiv.innerHTML = `💰 <span class="text-green-400">${priceText}</span>`;
          resultDiv.classList.add("animate-fadein");

          // 🎉 Confetti Celebration
          fireConfetti();

          // Update chart
          chart.data.labels.push(`Prediction ${chart.data.labels.length + 1}`);
          chart.data.datasets[0].data.push(priceValue);
          chart.update();

          // 🗺 Show map using ZIP
          const zip = data.zipcode.trim();
          mapContainer.classList.remove("hidden");
          mapFrame.src = `https://www.google.com/maps?q=${zip}&output=embed`;
        } else {
          resultDiv.innerHTML = `<span class="text-red-400">⚠️ ${result.error || 'Prediction failed.'}</span>`;
        }
      } catch (error) {
        console.error("❌ JS Error:", error);
        resultDiv.innerHTML = `<span class="text-red-400">🚫 Could not connect to API.</span>`;
      }
    });
  </script>

</body>
</html>
